<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Travels | Booking</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="container nav-container">
                <a href="index.html" class="brand-title">Aurora Travels</a>
                <div class="nav-links">
                    <a href="index.html">Home</a>
                    <a href="packages.html">Packages</a>
                    <a href="booking.html">Booking</a>
                    <a href="gallery.html">Gallery</a>
                    <a href="about.html">About Us</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="content-wrapper">
            <section>
                <h2>Start Your Adventure</h2>
                <p>Fill out this form and we’ll help you plan your perfect trip.</p>
                <form class="booking-form" id="bookingForm">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" required>

                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required>
                    
                    <label for="package">Select a Journey:</label>
                    <select id="package" name="package" required>
                        <option value="" disabled selected>--Choose a Journey--</option>
                        <option value="paris">Parisian Dream</option>
                        <option value="rome">Roman Holiday</option>
                        <option value="kyoto">Kyoto Cultural Escape</option>
                        <option value="nyc">Big Apple Adventure</option>
                        <option value="phuket">Thai Beach Bliss</option>
                    </select>

                    <label for="guests">Number of Guests:</label>
                    <input type="number" id="guests" name="guests" min="1" value="1" required>

                    <label for="start-date">Start Date:</label>
                    <input type="date" id="start-date" name="start-date" required>

                    <label for="end-date">End Date:</label>
                    <input type="date" id="end-date" name="end-date" required>

                    <label for="promo-code">Promo Code (optional):</label>
                    <input type="text" id="promo-code" name="promo-code" placeholder="e.g., EARLYBIRD">

                    <div class="price-estimator">
                        <strong>Estimated Total:</strong> <span id="estimated-price">₹0</span>
                    </div>

                    <button type="submit" id="submit-button" disabled>Send Request</button>
                </form>
            </section>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2025 Aurora Travels. All Rights Reserved.</p>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
